services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freight
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - freight-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/freight
      DATABASE_USER: freight
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BROKER_ADMIN_PASSWORD: ${BROKER_ADMIN_PASSWORD:?Set BROKER_ADMIN_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
volumes:
  freight-data:
